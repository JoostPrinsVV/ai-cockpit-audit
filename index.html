<!doctype html>
<html lang="nl" class="no-js" data-theme="licht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Veiligheid: alleen eigen bestanden. De enige verbinding naar buiten is de centrale opslag
       in Supabase (ideeënhub en anonieme tellers); demo's draaien in een afgeschermd iframe. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src https://*.supabase.co; object-src 'none'; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101d4f">
  <title>AI Cockpit Audit</title>
  <link rel="icon" href="assets/branding/favicon.svg" type="image/svg+xml">

  <!-- Huisstijl en lettertypes (overgenomen van de AI Snackbar), daarna de opmaak van dit platform -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/audit.css">

  <!-- Inhoud en instellingen (deze bestanden mag je aanpassen, zie README.md) -->
  <script defer src="js/config.js"></script>
  <script defer src="data/disciplines.js"></script>
  <script defer src="data/phases.js"></script>
  <script defer src="data/usecases.js"></script>
  <script defer src="data/prompts.js"></script>
  <script defer src="data/tips.js"></script>
  <script defer src="data/trainings.js"></script>
  <script defer src="data/agents.js"></script>

  <!-- Applicatie (volgorde is belangrijk) -->
  <script defer src="js/ui.js"></script>
  <script defer src="js/disciplines.js"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/central.js"></script>
  <script defer src="js/prompt-box.js"></script>
  <script defer src="js/reviews.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/view-home.js"></script>
  <script defer src="js/view-usecases.js"></script>
  <script defer src="js/view-prompts.js"></script>
  <script defer src="js/view-tips.js"></script>
  <script defer src="js/view-trainings.js"></script>
  <script defer src="js/view-agents.js"></script>
  <script defer src="js/view-ideas.js"></script>
  <script defer src="js/view-search.js"></script>
  <script defer src="js/admin-content.js"></script>
  <script defer src="js/admin-disciplines.js"></script>
  <script defer src="js/admin-newsletter.js"></script>
  <script defer src="js/view-admin.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-view="home">
  <a class="skip-link" href="#main" id="skip-link">Direct naar de inhoud</a>

  <!-- ================= Kopbalk ================= -->
  <header class="topbar on-dark" id="topbar">
    <div class="topbar__inner container">
      <div class="brand-group">
        <a class="brand" href="#/" id="brand" aria-label="Naar de startpagina">
          <span class="brand__mark" aria-hidden="true">
            <img class="brand__logo" src="assets/branding/logo-dark.svg" alt="" width="40" height="40">
          </span>
          <span class="brand__text">
            <span class="brand__title" id="brand-title">AI Cockpit</span>
          </span>
        </a>

        <!-- Wisselaar tussen de disciplines; de lijst bouwt js/disciplines.js -->
        <div class="switcher" id="switcher">
          <button class="switcher__button" type="button" id="switcher-button" aria-expanded="false" aria-controls="switcher-panel">
            <span class="brand__discipline" id="brand-discipline">Audit</span>
            <svg class="icon switcher__chevron" aria-hidden="true" focusable="false"><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="switcher__panel" id="switcher-panel" hidden></div>
        </div>
      </div>

      <nav class="nav" aria-label="Hoofdmenu">
        <ul class="nav__list" role="list">
          <li><a class="nav__link" href="#/usecases" data-nav="usecases">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-play-circle"></use></svg><span>Usecases</span></a></li>
          <li><a class="nav__link" href="#/prompts" data-nav="prompts">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chat"></use></svg><span>Prompts</span></a></li>
          <li><a class="nav__link" href="#/tips" data-nav="tips">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bulb"></use></svg><span>Tips<span class="nav__more"> &amp; tricks</span></span></a></li>
          <li><a class="nav__link" href="#/trainingen" data-nav="trainingen">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-cap"></use></svg><span>Training<span class="nav__tail">en</span></span></a></li>
          <li><a class="nav__link" href="#/agents" data-nav="agents">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-robot"></use></svg><span>Agents<span class="nav__more"> &amp; tools</span></span></a></li>
          <li><a class="nav__link" href="#/ideeen" data-nav="ideeen">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-message-plus"></use></svg><span>Ideeën<span class="nav__tail">hub</span></span></a></li>
        </ul>
      </nav>

      <div class="topbar__actions">
        <a class="btn btn--ghost-dark btn--icon" href="#/zoeken" id="search-button" aria-label="Zoeken">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
        </a>
        <button class="btn btn--ghost-dark btn--icon" type="button" id="theme-button" aria-label="Donker thema" aria-pressed="false">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Iedere pagina (route) wordt hier opgebouwd door js/view-*.js -->
    <div class="view" id="view" aria-live="off"></div>
  </main>

  <!-- ================= Voet ================= -->
  <footer class="footer" id="footer">
    <div class="container footer__inner">
      <section class="footer__rules" aria-labelledby="rules-title">
        <h2 class="footer__title" id="rules-title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-shield"></use></svg>
          <span>Vier gouden regels</span>
        </h2>
        <ol class="rules" role="list" id="footer-rules"></ol>
      </section>
      <div class="footer__meta">
        <p id="footer-updated"></p>
        <p class="footer__links">
          <a href="#/beheer">Beheer</a>
        </p>
        <p class="footer__small" id="footer-org"></p>
      </div>
    </div>
  </footer>

  <!-- Meldingen en schermlezers -->
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <!-- Vangnet als het opstarten mislukt -->
  <div class="fatal" id="fatal" hidden>
    <div class="fatal__panel">
      <h2 class="fatal__title">Er ging iets mis</h2>
      <p class="fatal__text">Herlaad de pagina. Blijft dit gebeuren? Laat het weten via de ideeënhub of je AI-aanspreekpunt.</p>
      <p class="fatal__detail" id="fatal-detail"></p>
    </div>
  </div>

  <noscript>
    <div class="fatal">
      <div class="fatal__panel">
        <h2 class="fatal__title">JavaScript staat uit</h2>
        <p class="fatal__text">Dit platform heeft JavaScript nodig. Zet JavaScript aan in de browser en herlaad de pagina.</p>
      </div>
    </div>
  </noscript>
