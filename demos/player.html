<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Copilot-demo (fictief)</title>
<!--
  AI Cockpit Audit: nagespeelde Copilot-demo. Welke demo? Het deel na de #
  (bijv. player.html#risicoanalyse). De gesprekken staan in demos/scripts.js.
  Alle namen, bedragen en organisaties zijn verzonnen.

  Los geopend werkt de demo zelfstandig (startknop, pauze, opnieuw).
  In het platform draait hij afgeschermd in een iframe en praat hij via
  postMessage met de speler (js/player.js):
    demo  -> pagina : { source: 'ai-snackbar-demo', event: 'ready' | 'playing' | 'paused' | 'ended' | 'activity' }
    pagina -> demo  : { source: 'ai-snackbar', command: 'play' | 'pause' | 'restart' }
-->
<link rel="stylesheet" href="demo.css">
<script defer src="scripts.js"></script>
<script defer src="engine.js"></script>
</head>
<body>
<div class="frame">
  <div class="chrome"><i></i><i></i><i></i><span id="url">m365.cloud.microsoft/chat</span></div>
  <div class="app" id="app">
    <nav class="rail" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.3-3.4A8 8 0 0 1 4 12z"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <svg viewBox="0 0 24 24"><path d="M5 4v16M9 4v16M13 4l5 16"/></svg>
      <svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg>
      <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0"/></svg></div>
    </nav>
    <div class="main">
      <div class="top"><span class="pill" id="mode">Copilot Chat</span><span id="model">Automatisch ▾</span><span class="shield" title="Zakelijke databescherming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3.5 5 6v5.5c0 4.3 2.9 7.8 7 9 4.1-1.2 7-4.7 7-9V6z"/><path d="M9 12l2.2 2.2L15.2 10"/></svg><span>Beschermd</span></span></div>
      <div class="convo" id="convo"></div>
      <div class="dock" id="dock"></div>
      <div class="disc">Door AI gegenereerde inhoud is mogelijk onjuist</div>
    </div>
    <div class="cursor" id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.2 4 7.3-2.8 1.5-4-7.4L4 20z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  </div>
</div>
<div class="controls">
  <button id="pause" type="button">❚❚ Pauze</button>
  <button id="restart" type="button">↺ Opnieuw</button>
  <button id="fs" type="button">⛶ Volledig scherm</button>
</div>
</body>
</html>
